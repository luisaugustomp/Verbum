<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verbum — Assistente Teológico Reformado</title>
  <meta name="description"
    content="Assistente teológico reformado com inteligência artificial, fundamentado nas Escrituras e na tradição reformada histórica.">
  <meta name="theme-color" content="#0B0E18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fontes: Fraunces (display/serif) + Outfit (interface) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Outfit:wght@300..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bibliotecas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ====================================================
       TELA DE LOGIN
       ==================================================== -->
  <div id="login-screen">
    <div id="login-sphere-anchor">
      <!-- A esfera é movida para aqui ao iniciar -->
    </div>
    <div class="login-brand">
      <h1 id="login-title">Verbum</h1>
      <p>Assistente Teológico Reformado</p>
    </div>
    <div class="login-card glass">
      <div class="login-form">
        <input type="text" id="auth-name" placeholder="Nome" autocomplete="username" spellcheck="false">
        <input type="password" id="auth-password" placeholder="Senha" autocomplete="current-password">
        <div id="auth-error"></div>
        <button class="btn-primary" id="btn-login" disabled>Entrar</button>
        <button class="btn-secondary" id="btn-register" disabled>Criar Conta</button>
      </div>
    </div>
  </div>

  <!-- ====================================================
       TELA PRINCIPAL DO APLICATIVO
       ==================================================== -->
  <div id="app-screen">

    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div class="sidebar-header">
        <h2>Conversas</h2>
        <button class="icon-btn" id="close-sidebar-btn" aria-label="Fechar menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <button id="new-conv-btn">
        <i class="fa-solid fa-feather-pointed"></i>
        Nova Conversa
      </button>

      <div id="conversations-list"></div>

      <div class="sidebar-footer">
        <button id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          Sair
        </button>
      </div>
    </div>

    <!-- Conteúdo Principal -->
    <div id="main-content" class="empty-chat">

      <!-- Cabeçalho -->
      <header id="app-header">
        <div class="header-left">
          <button class="icon-btn" id="menu-btn" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
        <div class="header-center">
          <h1 id="app-title">Verbum</h1>
          <p>Assistente Teológico</p>
        </div>
        <div class="header-right">
          <!-- Espaço reservado -->
        </div>
      </header>

      <!-- Esfera -->
      <div id="app-sphere-anchor">
        <!-- A esfera é movida para aqui após o login -->
      </div>

      <!-- Chat -->
      <div id="chat-section">
        <div id="chat-messages">
          <div class="welcome-hint" id="welcome-hint">
            <strong>Sola Scriptura</strong>
            A Palavra é a luz para o nosso caminho. Faça uma pergunta teológica fundamentada nas Escrituras e na
            tradição reformada.
          </div>
        </div>
      </div>

      <!-- Campo de Entrada -->
      <div id="input-section">
        <div class="input-wrapper">
          <textarea id="user-input" rows="1" placeholder="Faça uma pergunta teológica..."></textarea>
          <button id="send-btn" aria-label="Enviar mensagem">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contêiner portátil da esfera -->
  <div id="sphere-wrap">
    <canvas id="sphere-canvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>

</html>
